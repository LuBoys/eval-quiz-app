server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
    resolver_timeout 5s;
    set $backend_url "${BACKEND_URL}";

    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # Main app
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Admin page - serve gestion-quiz.html for /gestion-quiz route
    location = /gestion-quiz {
        try_files /gestion-quiz.html =404;
    }

    # API proxy to the backend configured for this environment
    location /api/ {
        proxy_pass $backend_url;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location = /health {
        proxy_pass $backend_url;
    }
}
