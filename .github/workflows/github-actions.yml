name: Quiz App CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verifier-scan:
    name: Build et scan Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: quiz-ci
      POSTGRES_PASSWORD: mot-de-passe-du-test-ci
      ADMIN_PASSWORD: mot-de-passe-admin-du-test-ci
      JWT_SECRET: cle-fictive-du-test-ci
      DATABASE_URL: ''
      RESEND_API_KEY: ''
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construire les images Docker
        run: docker compose build --pull

      - name: Scanner les trois images
        run: scripts/scan-images.sh quiz-ci-frontend quiz-ci-backend quiz-ci-db

      - name: Tester le quiz avec PostgreSQL local
        run: |
          docker compose up --no-build --wait --wait-timeout 90
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          import json

          base = 'http://127.0.0.1:8087'
          with urlopen(base + '/health', timeout=10) as response:
              assert response.status == 200 and json.load(response) == {'status': 'ok'}
          with urlopen(base + '/gestion-quiz', timeout=10) as response:
              assert response.status == 200 and b'Administration' in response.read()

          def post(path, payload):
              request = Request(base + path, data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'})
              with urlopen(request, timeout=10) as response:
                  assert response.status == 201
                  return json.load(response)

          user = post('/api/users', {'firstname': 'CI', 'email': 'ci@example.test'})
          result = post('/api/results', {
              'userId': user['id'], 'score': 1, 'totalQuestions': 1,
              'answers': [{'questionIndex': 0, 'questionText': 'Démo', 'userAnswer': 'Oui',
                           'correctAnswer': 'Oui', 'isCorrect': True, 'timeSpentMs': 500}],
          })
          assert result['quizResultId'] > 0 and result['emailSent'] is False
          PY

      - name: Archiver les images validées
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker image save quiz-ci-frontend quiz-ci-backend | gzip -1 > "$RUNNER_TEMP/quiz-images.tar.gz"

      - name: Transmettre les images au déploiement
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quiz-images-${{ github.sha }}
          path: ${{ runner.temp }}/quiz-images.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Arrêter les conteneurs de test
        if: always()
        run: docker compose down --volumes

  deployer:
    name: Publier et déployer sur Azure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verifier-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: quiz-app-azure
      cancel-in-progress: false
    steps:
      - name: Récupérer le script de déploiement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Récupérer les images validées
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quiz-images-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Se connecter à Azure via OpenID Connect
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publier dans ACR et mettre à jour les Container Apps
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
          AZURE_ACR_PULL_IDENTITY: ${{ vars.AZURE_ACR_PULL_IDENTITY }}
          AZURE_BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
          AZURE_FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'Une version plus récente est arrivée sur main.'
            exit 0
          fi
          docker image load --input "$RUNNER_TEMP/quiz-images.tar.gz"
          scripts/deploy.sh "$GITHUB_SHA"
